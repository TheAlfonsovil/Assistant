[project]
name = "assistant-core"
version = "0.6.4"
description = "Persistent local task engine for Assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "aiosqlite>=0.20,<1.0",
  "typer>=0.15,<1.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
  # Windows ships no system timezone database, so IANA zone names (used by
  # daily schedules) need this pure-Python package.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=1.2,<2.0",
  "ruff>=0.8,<1.0",
]
# Runtime inspection (``debug.trace``). Optional on purpose: the tool reports
# ``missing-debugpy`` instead of failing, so the assistant runs without it.
debug = [
  "debugpy>=1.8",
]
# Desktop window observation (``window.list`` / ``window.snapshot``) through the
# Windows accessibility tree. Pure Python; the tool reports what is missing.
uia = [
  "uiautomation>=2.0",
]

[project.scripts]
assistant = "assistant.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["assistant*"]
