<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Series · Video Generator</title>
    <style>
      :root { --bg: #05070d; --panel: #0b1120; --line: #1e293b; --text: #e2e8f0; --dim: #64748b; --brand: #38bdf8; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, sans-serif; }
      header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; }
      header h1 { margin: 0; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; }
      header .spacer { flex: 1; }
      main { display: grid; grid-template-columns: 1fr 320px; gap: 18px; padding: 18px 20px; align-items: start; }
      .stage { background: #000; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; justify-content: center; }
      canvas { display: block; max-width: 100%; height: auto; }
      aside { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
      label { display: grid; gap: 5px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
      input, select { background: #0f172a; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--text); font: inherit; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      button { background: linear-gradient(90deg, #0ea5e9, #22d3ee); border: 0; border-radius: 9px; padding: 9px 14px; color: #041022; font-weight: 700; cursor: pointer; }
      button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
      .scenes { display: grid; gap: 6px; }
      .scene-item { display: flex; justify-content: space-between; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; cursor: pointer; }
      .scene-item.active { border-color: var(--brand); color: var(--brand); }
      .hud { font: 12px ui-monospace, monospace; color: var(--dim); }
      progress { width: 100%; height: 6px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Series</h1>
      <span class="hud" id="hud">—</span>
      <span class="spacer"></span>
      <button id="play" class="ghost">Reproducir</button>
      <button id="pause" class="ghost">Pausa</button>
      <button id="restart" class="ghost">Reiniciar</button>
      <button id="export">EXPORTAR VIDEO</button>
    </header>
    <main>
      <div class="stage"><canvas id="canvas"></canvas></div>
      <aside>
        <div>
          <label for="seek">Timeline</label>
          <input id="seek" type="range" min="0" max="1000" value="0" />
        </div>
        <div class="row">
          <label>FPS <input id="fps" type="number" min="1" max="60" value="24" /></label>
          <label>Ancho <input id="width" type="number" min="64" step="2" value="854" /></label>
          <label>Alto <input id="height" type="number" min="64" step="2" value="480" /></label>
        </div>
        <div>
          <label>Salida</label>
          <select id="format">
            <option value="mp4">MP4 (H.264)</option>
            <option value="webm">WebM (VP9)</option>
            <option value="gif">GIF</option>
          </select>
        </div>
        <div>
          <label>Escenas</label>
          <div class="scenes" id="scenes"></div>
        </div>
        <div class="hud" id="status">Listo</div>
        <progress id="progress" value="0" max="1" />
      </aside>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
